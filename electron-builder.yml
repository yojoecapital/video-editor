appId: io.github.yojoe.VideoEditor
productName: Video Editor
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# The static ffmpeg/ffprobe binaries must stay outside the asar so they can be exec'd.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/bin/linux/**
linux:
  target:
    - dir
    - AppImage
  category: AudioVideo
  icon: build/icon.png
  desktop:
    entry:
      Name: Video Editor
      Comment: Non-linear video editor
      MimeType: application/x-yaml;
